# parity-case: G - continuation joined, but still only --max-time; flagged at the curl's FIRST line
# canonical-rule5-lines: 9
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -fsSL \
            --max-time 120 \
            -o /tmp/x https://example.invalid/
