# parity-case: E - both bounds on a backslash continuation line
# canonical-rule5-lines: none
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -fsSL \
            --max-time 120 --connect-timeout 10 \
            -o /tmp/x https://example.invalid/
